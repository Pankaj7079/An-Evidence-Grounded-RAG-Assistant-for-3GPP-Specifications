[project]
name = "threegpp-spec-assistant"
version = "0.1.0"
description = "An Evidence-Grounded RAG Assistant for 3GPP Specifications (TS 23.501 & TS 23.502)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24.0",
    "sentence-transformers>=3.0.0",
    "qdrant-client>=1.11.0",
    "rank-bm25>=0.2.2",
    "google-genai>=0.1.1",
    "groq>=0.9.0",
    "streamlit>=1.36.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
